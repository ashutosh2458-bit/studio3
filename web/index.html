<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9e1e7;--panel:#f5f7f8;--ink:#1b2733;--mute:#5b6b7a;--line:#b9c5ce;--cobalt:#2a44e8;--amber:#f0a92e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
header{padding:20px 24px 4px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em}
header p{margin:0;color:var(--mute)}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;padding:16px 24px 24px;max-width:1200px;margin:auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.stage{background:var(--panel);border:1px solid var(--line);padding:12px}
#stage svg{display:block;width:100%;height:auto;aspect-ratio:1}
.meta{display:flex;justify-content:space-between;gap:8px;padding:10px 2px 0;color:var(--mute);font-size:14px}
.side{display:flex;flex-direction:column;gap:16px}
section{background:var(--panel);border:1px solid var(--line);padding:16px}
h2{margin:0 0 8px;font-size:18px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:9px 16px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;border-radius:4px}
button:hover{background:var(--ink);color:var(--panel)}
button.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
button.primary:hover{background:#1c33c4}
button.tab[aria-pressed=true]{background:var(--amber);border-color:var(--ink);color:var(--ink)}
button:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
#ai{margin:10px 0 0;color:var(--mute);font-size:15px}
pre{margin:10px 0;padding:12px;background:#1b2733;color:#e7edf2;font:13px/1.5 'DM Mono',ui-monospace,monospace;max-height:260px;overflow:auto;white-space:pre}
.saved{max-width:1200px;margin:0 auto;padding:0 24px 32px}
#saved{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
#saved button{padding:0;border:1px solid var(--line);background:var(--panel);aspect-ratio:1;overflow:hidden}
#saved svg{width:100%;height:100%;display:block}
.empty{color:var(--mute);margin:0}
</style>
</head>
<body>
<header><h1>Infinite Design Studio</h1><p>Every seed is a new design. Like what you see and the AI finds more of it.</p></header>
<main>
  <div class="stage"><div id="stage" role="img" aria-label="Current generated design"></div>
    <div class="meta"><span id="desc">Loading engine…</span><span id="seed"></span></div></div>
  <div class="side">
    <section><h2>Explore</h2>
      <div class="row">
        <button class="primary" id="like">Like and find similar</button>
        <button id="skip">Skip</button>
        <button id="shuffle">Random design</button>
      </div>
      <p id="ai"></p></section>
    <section><h2>Get the code</h2>
      <div class="row"><button class="tab" id="tjs" aria-pressed="true">JavaScript</button><button class="tab" id="tsvg" aria-pressed="false">SVG</button></div>
      <pre id="code" tabindex="0"></pre>
      <div class="row"><button id="copy">Copy code</button><button id="dl">Download file</button></div></section>
  </div>
</main>
<div class="saved"><h2>Liked designs</h2><div id="saved"></div></div>
<script>
var Module = { onRuntimeInitialized: init };
const $ = s => document.querySelector(s);
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)) || []; } catch(e){ return []; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let seed = 0, kind = 'js', counter = Date.now() % 1e6;
let saved = store.get('ids-saved'), ratings = store.get('ids-ratings');
const call = (name, ret, args) => Module.ccall(name, ret, args.map(() => 'number'), args);
const rand = () => Math.floor(Math.random() * 2147483647);

function init(){
  ratings.forEach(([s, l]) => call('ai_learn', null, [s, l]));
  renderSaved(); show(rand());
}
function code(){ return kind === 'js' ? call('export_js','string',[seed]) : call('render_svg','string',[seed]); }
function show(s){
  seed = s;
  $('#stage').innerHTML = call('render_svg','string',[s]);
  $('#desc').textContent = call('describe','string',[s]);
  $('#seed').textContent = 'Seed ' + s;
  $('#ai').textContent = call('ai_report','string',[]);
  $('#code').textContent = code();
}
function rate(liked){
  call('ai_learn', null, [seed, liked]);
  ratings = ratings.concat([[seed, liked]]).slice(-300); store.set('ids-ratings', ratings);
  if (liked && !saved.includes(seed)) { saved.unshift(seed); saved = saved.slice(0, 24); store.set('ids-saved', saved); renderSaved(); }
  show(call('ai_suggest','number',[++counter]));
}
function renderSaved(){
  const box = $('#saved'); box.innerHTML = '';
  if (!saved.length) { box.innerHTML = '<p class="empty">Designs you like are kept here.</p>'; return; }
  saved.forEach(s => {
    const b = document.createElement('button');
    b.setAttribute('aria-label', 'Open design ' + s);
    b.innerHTML = call('render_svg','string',[s]);
    b.onclick = () => { show(s); window.scrollTo({top:0,behavior:'smooth'}); };
    box.appendChild(b);
  });
}
function setKind(k){
  kind = k; $('#tjs').setAttribute('aria-pressed', k==='js'); $('#tsvg').setAttribute('aria-pressed', k==='svg');
  $('#code').textContent = code();
}
$('#like').onclick = () => rate(1);
$('#skip').onclick = () => rate(0);
$('#shuffle').onclick = () => show(rand());
$('#tjs').onclick = () => setKind('js');
$('#tsvg').onclick = () => setKind('svg');
$('#copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('#code').textContent); $('#copy').textContent = 'Copied'; }
  catch(e){ $('#copy').textContent = 'Select the code and copy'; }
  setTimeout(() => $('#copy').textContent = 'Copy code', 1500);
};
$('#dl').onclick = () => {
  const text = $('#code').textContent, isJs = kind === 'js';
  const body = isJs ? '<!doctype html><meta charset="utf-8"><body style="margin:0"><script>\n' + text + '\n<\/script>' : text;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body], {type: isJs ? 'text/html' : 'image/svg+xml'}));
  a.download = 'design-' + seed + (isJs ? '.html' : '.svg'); a.click(); URL.revokeObjectURL(a.href);
};
</script>
<script src="designer.js"></script>
</body>
</html>
